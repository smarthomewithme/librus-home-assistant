pobierz_tresc_wiadomosci:
  name: Pobierz treść wiadomości
  description: >-
    Otwiera jedną z pięciu ostatnich wiadomości widocznych w sensorze Librusa
    i udostępnia jej pełną treść w atrybucie wybrana_wiadomosc.
  target:
    entity:
      integration: librus_apix
      domain: sensor
  fields:
    indeks:
      name: Numer wiadomości
      description: Pozycja wiadomości na liście, liczona od zera.
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 4
          step: 1
          mode: box

pobierz_tresc_terminarza:
  name: Pokaż treść wpisu terminarza
  description: >-
    Wybiera jeden z pięciu najbliższych wpisów widocznych w sensorze terminarza
    i udostępnia jego szczegóły oraz treść nauczyciela w atrybucie
    wybrane_zdarzenie.
  target:
    entity:
      integration: librus_apix
      domain: sensor
  fields:
    indeks:
      name: Numer wydarzenia
      description: Pozycja wydarzenia na liście, liczona od zera.
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 4
          step: 1
          mode: box

potwierdz_odczytanie:
  name: Potwierdź odczytanie
  description: >-
    Trwale zapamiętuje odczytanie danych Librusa wewnątrz integracji, bez
    helperów input_text. Obsługuje oceny, terminarz, wiadomości, zadania,
    zachowanie oraz uwagi.
  fields:
    entity_id:
      name: Encja Librusa
      description: Encja należąca do konta ucznia, którego odczyt ma zostać zapisany.
      required: true
      selector:
        entity:
          integration: librus_apix
          domain: sensor
    kategoria:
      name: Kategoria
      description: Rodzaj danych, które mają zostać oznaczone jako odczytane.
      required: true
      selector:
        select:
          options:
            - oceny
            - terminarz
            - wiadomosci
            - zadania
            - zachowanie
            - uwagi
    indeks:
      name: Indeks pozycji
      description: >-
        Opcjonalny numer pozycji liczony od zera. Bez indeksu oceny, zadania
        i zachowanie są potwierdzane zbiorczo. Dla wiadomości i terminarza
        bez indeksu używana jest aktualnie otwarta pozycja.
      required: false
      example: 0
      selector:
        number:
          min: 0
          max: 99
          step: 1
          mode: box
